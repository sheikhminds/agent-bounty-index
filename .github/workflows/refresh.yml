name: refresh index

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # bountylint is the single source of truth for scoring. Do not fork its logic here.
      - name: Fetch bountylint
        run: git clone --depth 1 https://github.com/sheikhminds/bountylint bountylint

      - name: Generate
        run: python3 generate.py

      - name: Sanity check output
        run: |
          test -s public/index.html
          grep -q "Agent-Eligible Bounty Index" public/index.html
          python3 -c "import json;json.load(open('public/data.json'))"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
